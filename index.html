    <script>
      (function() {
        var isWsError = function(e) {
          var t = (e && (e.message || (e.reason && e.reason.message) || e.reason || '')) + '';
          return t.indexOf('WebSocket closed without opened') !== -1 ||
                 t.indexOf('WebSocket is closed before the connection is established') !== -1 ||
                 t.indexOf('failed: WebSocket is closed') !== -1;
        };
        window.addEventListener('unhandledrejection', function(evt) {
          if (isWsError(evt)) {
            evt.preventDefault();
            evt.stopPropagation();
          }
        });
        window.addEventListener('error', function(evt) {
          if (isWsError(evt)) {
            evt.preventDefault();
            evt.stopPropagation();
          }
        });
      })();
    </script>
